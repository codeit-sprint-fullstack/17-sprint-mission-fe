<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>

    <!-- 폰트: Pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/palette.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <main class="auth">
      <a class="auth-logo" href="index.html">
        <img src="images/logo.png" alt="판다마켓" />
      </a>

      <form class="auth-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <div class="input-box">
            <input id="email" name="email" type="email" placeholder="이메일을 입력해주세요" />
          </div>
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="input-box">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요" />
          <img src="images/icon-eye-off.svg" alt="비밀번호 보기" />
          </div>
        </div>
        <button class="btn-submit" type="submit" disabled>로그인</button>
      </form>

      <div class="easy-login">
        <p class="easy-login-title">간편 로그인하기</p>
        <div class="easy-login-icons">
          <a href="https://www.google.com/" target="_blank" rel="noopener">
            <img src="images/icon-google.png" alt="구글로 로그인" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener">
            <img src="images/icon-kakao.png" alt="카카오톡으로 로그인" />
          </a>
        </div>
      </div>

      <p class="auth-switch">판다마켓이 처음이신가요? <a href="signup.html">회원가입</a></p>
    </main>

  </body>
</html>
