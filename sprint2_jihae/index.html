<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <!-- 폰트: Pretendard, Inter -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/palette.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- 상단 네비게이션 (스크롤해도 최상단 고정) -->
    <header class="header">
      <div class="inner">
        <a class="logo" href="index.html">
          <img src="images/logo.png" alt="판다마켓" />
        </a>
        <a class="btn btn-login" href="login.html">로그인</a>
      </div>
    </header>

    <main>
      <!-- 히어로 -->
      <section class="banner">
        <div class="banner-inner">
          <div class="banner-text">
            <h1 class="banner-title">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a class="btn btn-explore" href="items.html">구경하러 가기</a>
          </div>
          <img class="banner-img" src="images/hero.png" alt="판다마켓 히어로 일러스트" />
        </div>
      </section>

      <!-- 기능 소개 -->
      <div class="features">
        <section class="feature feature-hot">
          <img class="feature-img" src="images/feature-01.png" alt="인기 상품 일러스트" />
          <div class="feature-text">
            <p class="feature-label">Hot item</p>
            <h2 class="feature-title">
              인기 상품을<br />
              확인해 보세요
            </h2>
            <p class="feature-desc">
              가장 HOT한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </section>

        <section class="feature feature-search">
          <div class="feature-text">
            <p class="feature-label">Search</p>
            <h2 class="feature-title">
              구매를 원하는<br />
              상품을 검색하세요
            </h2>
            <p class="feature-desc">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
          <img class="feature-img" src="images/feature-02.png" alt="상품 검색 일러스트" />
        </section>

        <section class="feature feature-register">
          <img class="feature-img" src="images/feature-03.png" alt="상품 등록 일러스트" />
          <div class="feature-text">
            <p class="feature-label">Register</p>
            <h2 class="feature-title">
              판매를 원하는<br />
              상품을 등록하세요
            </h2>
            <p class="feature-desc">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </section>
      </div>

      <!-- 하단 배너 -->
      <div class="bottom-banner">
        <section class="banner">
          <div class="banner-inner">
            <div class="banner-text">
              <h2 class="banner-title">
                믿을 수 있는<br />
                판다마켓 중고 거래
              </h2>
            </div>
            <img class="banner-img" src="images/bottom.png" alt="판다마켓 하단 일러스트" />
          </div>
        </section>
      </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
      <div class="inner">
        <p class="footer-copy">©codeit - 2024</p>
        <nav class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </nav>
        <div class="footer-sns">
          <a href="https://www.facebook.com/" target="_blank" rel="noopener">
            <img src="images/icon-facebook.svg" alt="Facebook" />
          </a>
          <a href="https://twitter.com/" target="_blank" rel="noopener">
            <img src="images/icon-twitter.svg" alt="Twitter" />
          </a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener">
            <img src="images/icon-youtube.svg" alt="YouTube" />
          </a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener">
            <img src="images/icon-instagram.svg" alt="Instagram" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
