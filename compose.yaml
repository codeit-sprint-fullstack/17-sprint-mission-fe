name: mission5be
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - products-db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  products-db:
