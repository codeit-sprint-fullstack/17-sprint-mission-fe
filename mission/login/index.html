<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미션2</title>
  <link rel="stylesheet" href="/login/style.css">
  
</head>
<body>
   <main class="login-page">
    <div class="logo-link">
      <a href="/" class="logo">
        <img src="../images/logo2.png" alt="판다마켓">
      </a>
    </div>
 <form class="login-form" method="post">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email"
         placeholder="이메일을 입력해주세요" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="password-field">
          <input id="password" name="password" type="password" 
          placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required>
          <!-- HTML/CSS 화면 구현용 아이콘입니다. -->
          <img class="password-icon" src="../images/eye-off.png" alt="">
        </div>
      </div>
      <button class="login-button" type="submit">로그인</button>
    </form>

    <section class="social-login" aria-label="간편 로그인">
      <span>간편 로그인하기</span>
      <div class="social-links">
        <a href="https://www.google.com/" aria-label="구글로 이동">
          <img src="../images/google.png" alt="구글">
        </a>
        <a href="https://www.kakaocorp.com/page/" aria-label="카카오로 이동">
          <img src="../images/kakao.png" alt="카카오">
        </a>
      </div>
    </section>

    <p class="signup-text">판다마켓이 처음이신가요? <a href="/signup">회원가입</a></p>
  </main>
 
</body>
</html>
