<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 판다마켓</title>
  <link rel="stylesheet" href="/login/style.css">
</head>
<body>
  <main class="signup-page">
    <a class="signup-logo" href="/">
      <img src="../images/logo2.png" alt="판다마켓">
    </a>

    <form class="signup-form" method="post">
      <div class="signup-field">
        <label for="signup-email">이메일</label>
        <input
          id="signup-email"
          name="email"
          type="email"
          placeholder="이메일을 입력해주세요"
          autocomplete="email"
          required
        >
      </div>

      <div class="signup-field">
        <label for="nickname">닉네임</label>
        <input
          id="nickname"
          name="nickname"
          type="text"
          placeholder="닉네임을 입력해주세요"
          autocomplete="nickname"
          required
        >
      </div>

      <div class="signup-field">
        <label for="signup-password">비밀번호</label>
        <div class="signup-password-wrap">
          <input
            id="signup-password"
            name="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
            autocomplete="new-password"
            required
          >
          <button
            class="signup-password-toggle"
            type="button"
            aria-label="비밀번호 표시"
            aria-controls="signup-password"
            aria-pressed="false"
          >
            <img src="../images/eye-off.png" alt="">
          </button>
        </div>
      </div>

      <div class="signup-field">
        <label for="password-confirm">비밀번호 확인</label>
        <div class="signup-password-wrap">
          <input
            id="password-confirm"
            name="passwordConfirm"
            type="password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
            autocomplete="new-password"
            required
          >
          <button
            class="signup-password-toggle"
            type="button"
            aria-label="비밀번호 확인 표시"
            aria-controls="password-confirm"
            aria-pressed="false"
          >
            <img src="../images/eye-off.png" alt="">
          </button>
        </div>
      </div>

      <button class="signup-submit" type="submit">
        회원가입
      </button>
    </form>

    <section class="signup-social" aria-label="간편 로그인">
      <span>간편 로그인하기</span>

      <div class="signup-social-links">
        <a href="https://www.google.com/" aria-label="구글로 이동">
          <img src="../images/google.png" alt="구글">
        </a>
        <a href="https://www.kakaocorp.com/page/" aria-label="카카오로 이동">
          <img src="../images/kakao.png" alt="카카오">
        </a>
      </div>
    </section>

    <p class="signup-footer">
      이미 회원이신가요? <a href="/login">로그인</a>
    </p>
  </main>
</body>
</html>
