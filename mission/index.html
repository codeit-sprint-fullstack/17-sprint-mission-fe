 </header>

<!-- 첫 번째: 인기 상품 -->
<section class="section">

      <img src="images/section01.jpg" alt="인기 상품 이미지">
    </div>

    </div>
  </div>
</section>

</section>

    </div>

    <div class="section-textbox">
      <span>Register</span>

      <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
    </div>

<section class="section-2">
