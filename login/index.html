<!doctype html>
<html>
  <head>
    <title>로그인 - 판다마켓</title>
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <div class="login-page">
      <div class="login-box">
        <a href="../index.html" class="logo">
          <img src="../images/logo.png" alt="판다마켓" />
          <span>판다마켓</span>
        </a>

        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="이메일을 입력해주세요" />

        <label for="password">비밀번호</label>
        <div class="password-field">
          <input
            id="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="비밀번호 보기"
            onclick="togglePassword('password')"
          >
            <img src="../images/eyes.png" alt="" />
          </button>
        </div>

        <button id="login-submit" disabled>로그인</button>
        <div class="social-login">
          <span>간편 로그인하기</span>
          <a href="https://www.google.com/" aria-label="Google 로그인">
            <img src="../images/google.png" alt="" />
          </a>
          <a href="https://www.kakaocorp.com/page/" aria-label="카카오 로그인">
            <img src="../images/kakao.png" alt="" />
          </a>
        </div>

        <p>
          판다마켓이 처음이신가요?
          <a href="../signup/index.html">회원가입</a>
        </p>
      </div>
    </div>
    <script>
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
      }
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginButton = document.getElementById("login-submit");

      function updateLoginButton() {
        loginButton.disabled = !emailInput.value.trim() || !passwordInput.value;
      }

      emailInput.addEventListener("input", updateLoginButton);
      passwordInput.addEventListener("input", updateLoginButton);
    </script>
  </body>
</html>
