<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 판다마켓</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/login-sign-up.css" />
  </head>
  <body class="signup-page">
    <main class="main">
      <a class="main-logo" href="/" aria-label="판다마켓 홈">
        <img src="img/logo2.png" alt="" />
        <h1>판다마켓</h1>
      </a>

      <section class="form-container" aria-label="회원가입">
        <form class="signup-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
              autocomplete="email"
              required
            />
          </div>
          <div class="input-group">
            <label for="nickname">닉네임</label>
            <input
              type="text"
              id="nickname"
              name="nickname"
              placeholder="닉네임을 입력해주세요"
              autocomplete="nickname"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">비밀번호</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="password"
                name="password"
                class="password-input"
                placeholder="비밀번호를 입력해주세요"
                autocomplete="new-password"
                required
              />
              <input
                type="checkbox"
                id="toggle-signup-password"
                class="password-visibility-toggle"
                aria-label="비밀번호 표시 또는 가리기"
              />
              <label class="password-toggle" for="toggle-signup-password">
                <img class="icon-hidden" src="img/password-hidden.svg" alt="" />
                <img
                  class="icon-visible"
                  src="img/password-visible.svg"
                  alt=""
                />
              </label>
            </div>
          </div>
          <div class="input-group">
            <label for="password-confirm">비밀번호 확인</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="password-confirm"
                name="password-confirm"
                class="password-input"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                autocomplete="new-password"
                required
              />
              <input
                type="checkbox"
                id="toggle-confirm-password"
                class="password-visibility-toggle"
                aria-label="비밀번호 표시 또는 가리기"
              />
              <label class="password-toggle" for="toggle-confirm-password">
                <img class="icon-hidden" src="img/password-hidden.svg" alt="" />
                <img
                  class="icon-visible"
                  src="img/password-visible.svg"
                  alt=""
                />
              </label>
            </div>
          </div>
          <button class="signup-submit" type="submit">회원가입</button>
        </form>
      </section>

      <section class="simple-login" aria-label="간편 로그인">
        <span class="simple-login-text">간편 로그인하기</span>
        <div class="simple-login-href">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noreferrer"
            aria-label="Google 로그인"
          >
            <img src="img/google.png" alt="Google" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noreferrer"
            aria-label="카카오 로그인"
          >
            <img src="img/kakao.png" alt="카카오" />
          </a>
        </div>
      </section>

      <p class="sign-up">이미 회원이신가요? <a href="/login">로그인</a></p>
    </main>
  </body>
</html>
