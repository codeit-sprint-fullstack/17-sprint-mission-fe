<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 내 홈페이지</title>
    <!-- CSS 파일 연결 (경로에 맞게 수정) -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- 1. 상단 헤더 영역 (시멘틱 태그) -->
    <header>
      <!-- 양쪽 공백과 중앙 정렬을 잡아주는 container 클래스 -->
      <div class="container">
        <h1 class="logo"><a href="#">사이트 로고</a></h1>
        <nav>
          <ul>
            <li><a href="#">로그인</a></li>
            <li><a href="#">회원가입</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- 2. 메인 본문 영역 (시멘틱 태그) -->
    <main>
      <section class="signup-section">
        <div class="container">
          <h2>회원가입</h2>

          <!-- 회원가입 입력 폼 -->
          <form action="#" method="POST" class="signup-form">
            <div class="form-group">
              <label for="username">아이디</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="아이디를 입력해주세요"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">비밀번호</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력해주세요"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">이메일</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
              />
            </div>

            <button type="submit" class="submit-btn">가입하기</button>
          </form>
        </div>
      </section>
    </main>

    <!-- 3. 하단 푸터 영역 (시멘틱 태그) -->
    <footer>
      <div class="container">
        <p>&copy; 2026 My Website. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
