<!doctype html>
<html lang="en">
  <head>

    <title>Privacy</title>
    <link rel="stylesheet" href="auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <main class="main-container">
      <!-- 1. 로그인 화면 - 판다로고 -->
      <section class="logo-section">
        <nav class="logo-nav" aria-label="주요 메뉴">
          <a class="logo-block" href="index.html">
            <img class="logo-face" src="image/panda_logo.png" alt="" />
            <img
              class="logo-text"
              src="image/panda_sign.png"
              alt="판다마켓 홈"
            />
          </a>
        </nav>
      </section>

      <section class="privacy-statement">
        <span> [개인정보 처리방침 요약] </span> <br />
        <span>
          판다마켓(이하 '회사')은 이용자의 소중한 개인정보를 보호하며, 관련
          법령을 준수합니다.
        </span>
        <br />
        <span>수집 항목: 이메일, 닉네임 </span> <br />
        <span
          >비밀번호 수집 목적: 회원 가입, 서비스 이용 확인 및 고객 상담</span
        >
        <br />
        <span
          >보유 기간: 회원 탈퇴 시까지 (단, 관계 법령에 따라 일정 기간 보존될 수
          있음)
        </span>
        <br />
        <span
          >문의 사항: 개인정보 관련 문의는 고객센터를 통해 접수해 주세요.</span
        >
        <br />
      </section>
    </main>
  </body>
</html>
