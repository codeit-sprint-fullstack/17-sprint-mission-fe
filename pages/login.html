<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <title>로그인</title>
  </head>
  <body>
    <main class="login-main">
      <div class="main-group">
        <!-- 로그인 페이지 상단 로고 -->
        <h1 class="login-head">
          <a class="logo" href="../index.html">
            <img src="../images/panda-face-login.png" alt="판다마켓 로고" />
            <span>판다마켓</span>
          </a>
        </h1>

        <!-- 이메일 인풋 -->
        <form class="login-form">
          <div class="form-group">
            <label class="form-label">이메일</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
              required />
          </div>

          <!-- 비밀번호 인풋 -->
          <div class="form-group">
            <label class="form-label">비밀번호</label>
            <div class="password-group">
              <input
                class="password-input"
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력해주세요"
                required />
              <button class="password-btn">
                <img
                  src="../images/btn_visibility_on_24px.png"
                  alt="비밀번호 표시 버튼" />
              </button>
            </div>
          </div>

          <!-- 로그인 버튼 -->
          <button class="login-btn" type="submit">
            <span class="login-btn-text">로그인</span>
          </button>
        </form>

        <!-- 소셜 간편 로그인 -->
        <section class="social-login">
          <span class="social-text">간편 로그인하기</span>
          <div class="social-btn">
            <a href="https://www.google.com/" rel="noopener noreferrer"
              ><img src="../images/google_img.png" alt="구글 로고"
            /></a>
            <a href="https://www.kakaocorp.com/page/" rel="noopener noreferrer"
              ><img src="../images/kakao_img.png" alt="카카오톡 로고"
            /></a>
          </div>
        </section>

        <!-- 하단 회원가입 링크 -->
        <p class="signup">
          판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
        </p>
      </div>
    </main>
  </body>
</html>
