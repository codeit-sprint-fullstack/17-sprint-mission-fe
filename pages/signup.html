<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <title>회원가입</title>
  </head>

  <!-- 회원가입 페이지 상단 로고 -->
  <body>
    <main>
      <div class="main-group">
        <header>
          <img src="../images/panda-face-login.png" alt="판다마켓 로고" />
          <span>판다마켓</span>
        </header>

        <!-- 이메일 인풋 -->
        <form class="sign-form">
          <div class="form-group">
            <label class="form-label">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
              required
            />
          </div>

          <!-- 비밀번호 인풋 -->
          <div>
            <label>비밀번호</label>
            <div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력해 주세요"
                required
              />
              <button>
                <img
                  src="../images/btn_visibility_on_24px.png"
                  alt="비밀번호 표시 버튼"
                />
              </button>
            </div>
          </div>

          <!-- 로그인 버튼 -->
          <button tyoe="submit">
            <span>로그인</span>
          </button>
        </form>

        <!-- 소셜 간편 로그인 -->
        <section>
          <span>간편 로그인하기</span>
          <div>
            <a href="https://www.google.com/" rel="noopener noreferrer">
              <img src="../images/google_img.png" alt="구글 로고" />
            </a>
            <a href="https://www.kakaocorp.com/page/" rel="noopener noreferrer">
              <img src="../images/kakao_img.png" alt="카카오톡 로고" />
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
