<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./sub.css">

    <script src="./auth.js" defer></script>
</head>
<body>
    <main class="auth">
        <div class="auth_container">
            <a href="./index.html" class="auth_logo">
                <img src="./img/login-logo.png" alt="판다마켓">
            </a>

            <form class="auth_form">
                <div class="form_field">
                    <label for="id" class="form_label">이메일</label>
                    <input
                        type="text"
                        id="id"
                        name="email"
                        class="form_input"
                        placeholder="이메일을 입력해주세요"
                    >
                </div>

                <div class="form_field">
                    <label for="password" class="form_label">비밀번호</label>

                    <div class="input_box">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form_input"
                            placeholder="비밀번호를 입력해주세요"
                        >
                        <button
                            id="toggle_password"
                            type="button"
                            class="password_toggle"
                            aria-label="비밀번호 표시"
                            aria-controls="password"
                        >
                            <img src="./img/btn_visibility.png" alt="">
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth_submit" disabled>로그인</button>
            </form>

            <div class="auth_footer">
                <div class="social_login">
                    <p class="social_login_title">간편 로그인하기</p>

                    <div class="social_login_list">
                        <a href="https://www.google.com/" class="social_login_link">
                            <img src="./img/google-icon.png" alt="구글 로그인">
                        </a>

                        <a href="https://www.kakaocorp.com/page/" class="social_login_link">
                            <img src="./img/kakao-icon.png" alt="카카오 로그인">
                        </a>
                    </div>
                </div>

                <p class="auth_text">
                    판다마켓이 처음이신가요?
                    <a href="./signup.html" class="auth_link">회원가입</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
