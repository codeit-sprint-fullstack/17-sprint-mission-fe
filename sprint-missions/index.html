<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스프린트 미션 1 (두기표)</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrap">
        <header class="header">
            <a href="#" class="logo">
                <img src="./img/logo.png" alt="판다마켓 로고 이미지">
            </a>

            <a href="./login.html" class="login-but">로그인</a>
        </header>

        <main class="main">

            <section class="banner">
                <div class="banner-box">
                    <div class="banner-textbox">
                        <h1>일상의 모든 물건을<br>거래해 보세요</h1>
                        <a href="./items.html " class="banner-btn">구경하러 가기</a>
                    </div>
                    <div class="banner-imgbox"><img src="./img/banner.png" alt="배너 이미지"></div>
                </div>
            </section>

            <section class="section">
                <div class="section-item">
                    <div class="section-imgbox"><img src="./img/section01.jpg" alt="중고거래 이미지"></div>
                    <div class="section-textbox">
                        <span>Hot item</span>
                        <h2>인기 상품을<br>확인해 보세요</h2>
                        <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-item section-item-reverse">
                    <div class="section-imgbox"><img src="./img/section02.jpg" alt="중고거래 이미지"></div>
                    <div class="section-textbox">
                        <span>Search</span>
                        <h2>구매를 원하는<br>상품을 검색하세요</h2>
                        <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-item">
                    <div class="section-imgbox"><img src="./img/section03.jpg" alt="중고거래 이미지"></div>
                    <div class="section-textbox">
                        <span>Register</span>
                        <h2>판매를 원하는<br>상품을 등록하세요</h2>
                        <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                    </div>
                </div>
            </section>

            <section class="section-2">
                <div class="section-item-2">
                    <div class="section-textbox">
                        <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
                    </div>
                    <div class="section-imgbox"><img src="./img/section04.png" alt="중고거래 이미지"></div>
                </div>
            </section>

        </main>

        <footer class="footer">
            <p class="footer-copyright">©codeit - 2024</p>

            <div class="footer-link">
                <a href="./privacy.html">Privacy Policy</a>
                <a href="./faq.html">FAQ</a>
            </div>
            
            <div class="footer-sns">
                <a href="https://www.facebook.com/" target="_blank" class="sns-link"><img src="./img/ic_facebook.png" alt="Facebook"></a>
                <a href="https://x.com/" target="_blank" class="sns-link"><img src="./img/ic_twitter.png" alt="Twitter"></a>
                <a href="https://www.youtube.com/" target="_blank" class="sns-link"><img src="./img/ic_youtube.png" alt="YouTube"></a>
                <a href="https://www.instagram.com/" target="_blank" class="sns-link"><img src="./img/ic_instagram.png" alt="Instagram"></a>
            </div>
        </footer>
    </div>
</body>
</html>
