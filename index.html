<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 상단 메뉴 -->
    <header class="site-header">
      <nav class="header-content" aria-label="주요 메뉴">
        <a class="logo" href="">
          <img class="logo-face" src="image/panda_logo.png" alt="" />
          <img class="logo-text" src="image/Panda_sign.png" alt="판다마켓 홈" />
        </a>

        <a class="login-button" href="login.html">로그인</a>
      </nav>
    </header>

    <main>
      <!-- 1.구경하러 가기 영역 -->
      <section class="hero">
        <div class="hero-content">
          <div class="hero-text">
            <h1>
              일상의 모든 물건을<br />
              거래해보세요
            </h1>

            <a class="browse-button" href="items.html">구경하러 가기</a>
          </div>

          <img
            class="hero-image"
            src="image/Img_home_top.png"
            alt="물건 거래를 소개하는 판다 캐릭터"
          />
        </div>
      </section>

      <!-- 2. 인기 상품 소개 영역  -->
      <section class="feature">
        <div class="feature-content">
          <img
            class="feature-image"
            src="image/Frame 2608833.png"
            alt="옷과 액세서리 등 인기 상품을 보여주는 이미지"
          />
          <div class="feature-text">
            <p class="feature-label">Hot item</p>

            <h2>
              인기 상품을<br />
              확인해 보세요
            </h2>

            <p class="feature-description">
              가장 HOT한 중고거래 물품을<br />
              판다마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <!-- 3. 구매 희망 상품 검색 영역 -->
      <section class="feature">
        <div class="feature-content">
          <div class="feature-text feature-text-right">
            <p class="feature-label">Search</p>

            <h2>
              구매를 원하는<br />
              상품을 검색하세요
            </h2>

            <p class="feature-description">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>

          <img
            class="feature-image"
            src="image/Img_home_02.png"
            alt="돋보기로 원하는 상품을 검색하는 이미지"
          />
        </div>
      </section>

      <!-- 4. 판매 희망 상품 등록 영역 -->
      <section class="feature">
        <div class="feature-content">
          <img
            class="feature-image"
            src="image/Img_home_03.png"
            alt="판매를 원하는 상품을 등록하는 이미지"
          />
          <div class="feature-text">
            <p class="feature-label">Register</p>

            <h2>
              판매를 원하는<br />
              상품을 등록하세요
            </h2>

            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <!-- 5. 판다마켓 홍보 영역 -->
      <section class="hero-bottom">
        <div class="hero-bottom-content">
          <div class="hero-bottom-text">
            <h2>
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h2>
          </div>

          <img
            class="hero-bottom-image"
            src="image/Img_home_bottom.png"
            alt="믿음 주는 판다 캐릭터"
          />
        </div>
      </section>
    </main>

    <!-- 6.라이선스 및 Privacy-FAQ, SNS 링크 영역 -->
    <footer class="site-footer">
      <div class="footer-content">
        <p class="footer-copylight">ⓒcodeit-2024</p>

        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>

        <!-- 새 탭으로 창 열기 -->
        <!-- 새로 열린 페이지와 기존 페이지의 연결을 제한하고, 이동 시 출처 정보를 전달하지 않음 -->
        <div class="footer-sns">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/ic_facebook.png" alt="페이스북" />
          </a>

          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/ic_twitter.png" alt="트위터" />
          </a>

          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/ic_youtube.png" alt="유튜브" />
          </a>

          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
