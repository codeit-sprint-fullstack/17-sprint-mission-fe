<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div id="wrap">
        <header>
            <div class="inner-lg">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.png" alt="판다마켓">
                </a>
                <a href="/login" class="btn-sm-48 btn-login">로그인</a>
            </div>
        </header>
        <main id="container">
            <section class="top-section">
                <div class="inner-md">
                    <div class="txt">
                        <h1>
                            일상의 모든 물건을<br>
                            거래해 보세요
                        </h1>
                        <a href="/items" class="btn-lg btn-link">구경하러 가기</a>
                    </div>
                    <div class="img">
                        <img src="/assets/images/Img_home_top.png" alt="">
                    </div>
                </div>
            </section>
            <div class="contents">
                <section class="con-section">
                    <div class="inner-sm">
                        <div class="img">
                            <img src="/assets/images/Img_home_01.jpg" alt="">
                        </div>
                        <div class="txt">
                            <span>Hot item</span>
                            <h2>
                                인기 상품을<br>
                                확인해 보세요
                            </h2>
                            <p>
                                가장 HOT한 중고거래 물품을<br>
                                판다 마켓에서 확인해 보세요
                            </p>
                        </div>
                    </div>
                </section>
                <section class="con-section">
                    <div class="inner-sm">
                        <div class="img">
                            <img src="/assets/images/Img_home_03.jpg" alt="">
                        </div>
                        <div class="txt">
                            <span>Search</span>
                            <h2>
                                구매를 원하는<br>
                                상품을 검색하세요
                            </h2>
                            <p>
                                구매하고 싶은 물품은 검색해서<br>
                                쉽게 찾아보세요
                            </p>
                        </div>
                    </div>
                </section>
                <section class="con-section">
                    <div class="inner-sm">
                        <div class="img">
                            <img src="/assets/images/Img_home_02.jpg" alt="">
                        </div>
                        <div class="txt">
                            <span>Register</span>
                            <h2>
                                판매를 원하는<br>
                                상품을 등록하세요
                            </h2>
                            <p>
                                어떤 물건이든 판매하고 싶은 상품을<br>
                                쉽게 등록하세요
                            </p>
                        </div>
                    </div>
                </section>
            </div>
            <section class="bottom-section">
                <div class="inner-md">
                    <div class="txt">
                        <h2>
                            믿을 수 있는<br>
                            판다마켓 중고 거래
                        </h2>
                    </div>
                    <div class="img">
                        <img src="/assets/images/Img_home_bottom.png" alt="">
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="inner-lg">
                <p>©codeit-2024</p>
                <ul class="menu-box">
                    <li>
                        <a href="/privacy">Privacy Policy</a>
                    </li>
                    <li>
                        <a href="/faq">FAQ</a>
                    </li>
                </ul>
                <ul class="sns-box">
                    <li>
                        <a href="https://www.facebook.com/?locale=ko_KR" target="_blank" rel="noopener noreferrer">
                            <img src="/assets/images/ic_facebook.png" alt="페이스북">
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/?lang=ko" target="_blank" rel="noopener noreferrer">
                            <img src="/assets/images/ic_twitter.png" alt="트위터">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/?hl=ko&gl=KR&app=desktop" target="_blank" rel="noopener noreferrer">
                            <img src="/assets/images/ic_youtube.png" alt="유튜브">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                            <img src="/assets/images/ic_instagram.png" alt="인스타그램">
                        </a>
                    </li>
                </ul>
            </div>
        </footer>

</html>
