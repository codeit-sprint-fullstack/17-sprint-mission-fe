<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <img src="img/logo.png" alt="판다마켓" />
        </a>

        <a href="./login.html" class="login-button">
          <img src="img/login.png" alt="로그인" />
        </a>
      </div>
    </header>
    <main>
      <section class="banner">
        <div class="banner-content">
          <h1>
            일상의 모든 물건을<br />
            거래해 보세요
          </h1>

          <a href="./items.html" class="banner-button">
            <img src="img/gogo.png" alt="구경하러가기" />
          </a>
        </div>

        <img src="img/banner.png" alt="판다" class="panda" />
      </section>
      <section class="hotitem">
        <img src="./img/hotitem.jpg" alt="인기 상품" />

        <div class="hotitem-text">
          <span class="hotitem-label">Hot item</span>

          <h2>
            인기 상품을<br />
            확인해 보세요
          </h2>

          <p>
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </section>
      <section class="search">
        <img src="./img/section02.jpg" alt="상품 검색" />
        <div class="search-text">
          <span class="search-label">Search</span>

          <h2>구매를 원하는<br />상품을 검색하세요</h2>
          <p>
            구매하고 싶은 물품은 검색해서<br />
            쉽게 찾아보세요
          </p>
        </div>
      </section>
      <section class="register">
        <img src="./img/section03.jpg" alt="상품 등록" />

        <div class="register-text">
          <span class="register-label">Register</span>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <p>
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </section>
      <section class="trust">
        <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>

        <img src="./img/section04.png" alt="판다마켓 중고 거래" />
      </section>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <p>©NeoGround - 2026</p>

        <nav>
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./faq.html">FAQ</a>
        </nav>

        <div class="social">
          <a href="https://www.facebook.com/" target="_blank">
            <img src="./img/facebook.png" alt="페이스북" />
          </a>

          <a href="https://twitter.com/" target="_blank">
            <img src="./img/twitter.png" alt="트위터" />
          </a>

          <a href="https://www.youtube.com/" target="_blank">
            <img src="./img/youtube.png" alt="유튜브" />
          </a>

          <a href="https://www.instagram.com/" target="_blank">
            <img src="./img/instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
    <a href="#" class="top-button">↑<br />TOP</a>
  </body>
</html>
