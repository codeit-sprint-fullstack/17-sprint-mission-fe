<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>
  <body>
    <!-- 고정 네비게이션 바 -->
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <span class="logo-icon">
            <img src="images/logo/logo-face.png" alt="" />
          </span>
          <span class="logo-text">판다마켓</span>
        </a>
        <a href="/login/" class="btn">로그인</a>
      </div>
    </header>

    <main>
      <!-- hero -->
      <section class="hero">
        <div class="container">
          <div class="hero-text">
            <h1>일상의 모든 물건을<br />거래해 보세요</h1>
            <a href="/items/" class="btn">구경하러 가기</a>
          </div>
          <img
            src="images/landing/Img_home_top.png"
            srcset="
              images/landing/Img_home_top@2x.png 2x,
              images/landing/Img_home_top@3x.png 3x
            "
            alt="판다마켓 히어로 이미지"
          />
        </div>
      </section>

      <!-- Section 1 -->
      <section class="feature feature-1">
        <div class="container">
          <img
            src="images/landing/Img_home_01.png"
            srcset="
              images/landing/Img_home_01@2x.png 2x,
              images/landing/Img_home_01@3x.png 3x
            "
            alt="인기 상품"
          />
          <div class="feature-text">
            <span class="feature-label">Hot item</span>
            <h2>인기 상품을<br />확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </section>

      <!-- Section 2 -->
      <section class="feature feature-2">
        <div class="container">
          <img
            src="images/landing/Img_home_02.png"
            srcset="
              images/landing/Img_home_02@2x.png 2x,
              images/landing/Img_home_02@3x.png 3x
            "
            alt="상품 검색"
          />
          <div class="feature-text">
            <span class="feature-label">Search</span>
            <h2>구매를 원하는<br />상품을 검색하세요</h2>
            <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
          </div>
        </div>
      </section>

      <!-- Section 3 -->
      <section class="feature feature-3">
        <div class="container">
          <img
            src="images/landing/Img_home_03.png"
            srcset="
              images/landing/Img_home_03@2x.png 2x,
              images/landing/Img_home_03@3x.png 3x
            "
            alt="상품 등록"
          />
          <div class="feature-text">
            <span class="feature-label">Register</span>
            <h2>판매를 원하는<br />상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
          </div>
        </div>
      </section>

      <!-- CTA -->
      <section class="cta">
        <div class="container">
          <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
          <img
            src="images/landing/Img_home_bottom.png"
            srcset="
              images/landing/Img_home_bottom@2x.png 2x,
              images/landing/Img_home_bottom@3x.png 3x
            "
            alt="판다마켓 중고 거래"
          />
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <p class="copyright">©codeit - 2024</p>
        <nav class="footer-links">
          <a href="/privacy/">Privacy Policy</a>
          <a href="/faq/">FAQ</a>
        </nav>
        <div class="sns">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="ic-facebook" src="images/icons/ic_facebook.png" alt="페이스북" />
          </a>
          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="ic-twitter" src="images/icons/ic_twitter.png" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="ic-youtube" src="images/icons/ic_youtube.png" alt="유튜브" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="ic-instagram" src="images/icons/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
