<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/index.css" />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <!-- 머리말 -->
    <header>
      <div class="header-inner">
        <a href="./index.html" class="main-logo">
          <img src="./image/판다 얼굴.svg" alt="판다마켓" />
          <p class="main-title">판다마켓</p>
        </a>

        <a href="./login.html" class="header-login link-button">로그인</a>
      </div>
    </header>

    <main>
      <section class="top-banner">
        <div class="top-banner-inner">
          <div class="top-banner-text">
            <h2 class="section-title">
              일상의 모든 물건을<br />
              거래해 보세요
            </h2>
            <a href="./items.html" class="items link-button">구경하러 가기</a>
          </div>
          <img
            class="top-banner-img"
            src="./image/Img_home_top.png"
            alt="인사하는 판다"
          />
        </div>
      </section>

      <section class="section1">
        <div class="section-inner">
          <img
            src="./image/Frame 2608833.png"
            alt="상품을 보고 있는 판다 커플"
          />
          <div class="section-text">
            <p class="section-label">Hot item</p>
            <h2 class="section-title">
              인기 상품을<br />
              확인해보세요
            </h2>
            <p class="section-description">
              가장 HOT한 중고거래 물품을 <br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="section2">
        <div class="section-inner">
          <div class="section-text">
            <p class="section-label">Search</p>
            <h2 class="section-title">
              구매를 원하는 <br />
              상품을 검색하세요
            </h2>
            <p class="section-description">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
          <img src="./image/Img_home_02.png" alt="돋보기로 살펴보는 중" />
        </div>
      </section>

      <section class="section3">
        <div class="section-inner">
          <img src="./image/Group 33682.png" alt="여러 상품들" />
          <div class="section-text">
            <p class="section-label">Register</p>
            <h2 class="section-title">
              판매를 원하는<br />
              상품을 등록하세요
            </h2>
            <p class="section-description">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom-banner">
        <div class="bottom-banner-inner">
          <h2 class="bottom-banner-text section-title">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h2>
          <img
            src="./image/img_home_bottom.png"
            alt="좋은 이용 후기를 남기는 판다들"
          />
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <p>@Codeit - 2024</p>

        <div class="footer-links">
          <a href="./privacy.html" class="privacy">Privacy Policy</a>
          <a href="./faq.html" class="faq">FAQ</a>
        </div>

        <div class="sns">
          <a
            href="https://www.facebook.com/?locale=ko_KR"
            target="_blank"
            rel="noopener noreferrer"
            class="facebook"
          >
            <img src="./image/ic_facebook.png" alt="페이스북" />
          </a>
          <a
            href="https://twitter.com/?lang=ko"
            target="_blank"
            rel="noopener noreferrer"
            class="twitter"
          >
            <img src="./image/twitter_icon.png" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="youtube"
          >
            <img src="./image/youtube_icon.png" alt="유튜브" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="instagram"
          >
            <img src="./image/instagram_icon.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
