<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>panda_market</title>
    <link rel="stylesheet" href="./main/index.css" />
  </head>

  <body class="page-wrapper">
    <!--메인 타이틀-->
    <div class="home-page">
      <header class="main-title">
        <div class="main-title-box">
          <a href="#" class="panda-logo">
            <img
              src="../images/panda_face.png"
              alt="판다마켓 로고"
              class="panda_logo_img"
            />
            <span class="panda_logo_name">판다마켓</span>
          </a>
          <a href="../login/index.html" class="login-text">로그인</a>
        </div>
      </header>

      <!--메인 상단 이미지-->
      <div class="banner-wrapper">
        <section class="main-top-img">
          <div class="banner-top-box">
            <div class="banner-top-text-box">
              <p class="banner-top-text">
                일상의 모든 물건을 <br />
                거래해 보세요
              </p>
              <a href="../item/index.html" class="search-products"
                >구경하러 가기</a
              >
            </div>

            <img
              src="../images/Group 33680.png"
              alt="판다 마켓 메인 일러스트"
              class="banner-top-img-box"
            />
          </div>
        </section>
      </div>

      <!--홈페이지 이용 설명-->
      <section class="description">
        <div class="main-description">
          <div class="main-description-img">
            <img src="../images/Img_home_01.png" alt="인기 상품 예시 이미지" />
          </div>

          <div class="main-description-text">
            <p class="title-highlight1">Hot item</p>
            <p class="title-section1">
              인기 상품을 <br />
              확인해 보세요
            </p>
            <p class="title-text1">
              가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="description">
        <div class="search-description">
          <div class="search-description-text">
            <p class="title-highlight2">Search</p>
            <p class="title-section2">
              구매를 원하는<br />
              상품을 검색하세요
            </p>
            <p class="title-text2">
              구매하고 싶은 물품은 검색해서 <br />
              쉽게 찾아보세요
            </p>
          </div>

          <div class="search-description-img">
            <div class="search-box">
              <img src="../images/Group 33629.png" alt="구매 원하는 상품" />

              <div class="search-icon">
                <img src="../images/Group 33604.png" alt="돋보기" />
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="description">
        <div class="create-description">
          <div class="create-description-img">
            <img src="../images/Img_home_03.png" alt="상품 등록과정 이미지" />
          </div>

          <div class="create-description-text">
            <p class="title-highlight3">Register</p>
            <p class="title-section3">
              판매를 원하는 <br />
              상품을 등록하세요
            </p>
            <p class="title-text3">
              어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <!--메인 하단 이미지-->
      <div class="bottom-group">
        <div class="banner-wrapper">
          <section class="main-bottom-img">
            <div class="banner-bottom-box">
              <div class="banner-bottom-text-box">
                <p class="banner-bottom-text">
                  믿을 수 있는 <br />
                  판다마켓 중고 거래
                </p>
              </div>
              <img
                src="../images/Img_home_bottom.png"
                alt="판다 마켓 메인 일러스트"
                class="banner-bottom-img"
              />
            </div>
          </section>
        </div>

        <!--하단 홈페이지 정보-->

        <div class="info-wrapper">
          <footer class="site-info">
            <div class="site-info-text">
              <p class="since">@codeit - 2024</p>

              <div class="pr-faq">
                <a href="../item/index.html" class="privacy">Privacy Policy</a>
                <a href="../item/index.html" class="faq">FAQ</a>
              </div>

              <div class="sns">
                <a href="https://www.facebook.com/" class="facebook">
                  <img
                    src="../images/logo/ic_facebook.png"
                    alt="페이스북 사이트"
                  />
                </a>
                <a href="https://www.x.com/" class="x">
                  <img src="../images/logo/ic_twitter.png" alt="x 사이트" />
                </a>
                <a href="https://www.youtube.com/" class="youtube">
                  <img
                    src="../images/logo/ic_youtube.png"
                    alt="유튜브 사이트"
                  />
                </a>
                <a href="https://www.instagram.com/" class="instagram">
                  <img
                    src="../images/logo/ic_instagram.png"
                    alt="인스타그램 사이트"
                  />
                </a>
              </div>
            </div>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
