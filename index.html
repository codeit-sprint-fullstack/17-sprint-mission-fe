
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y07961R198"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Y07961R198');
</script>
</head>

<body>

  <!-- 상단 네비게이션 -->
  <header class="navbar">
    <a href="/" class="logo">
      <img src="./images/logo.png" alt="판다마켓" class="nav-logo">
    </a>

    <a href="/login/" class="login">
      <img src="./images/login.png" alt="로그인">
    </a>
  </header>

  <main>

    <!-- 메인 배너 -->
    <section class="banner">
      <div class="banner-content">
        <h1>
          일상의 모든 물건을<br>
          거래해 보세요
        </h1>

        <a href="/items/" class="items-button">
          구경하러 가기
        </a>
      </div>

      <div class="banner-image">
        <img src="./images/main_banner.png" alt="메인 배너 이미지">
      </div>
    </section>

    <!-- 배너 밑 이미지 1 : Hot item -->
    <section class="feature">
      <img src="./images/hot_items.png" alt="인기 상품 소개 이미지">

      <div class="feature-content">
        <p>Hot item</p>

        <h2>
          인기 상품을<br>
          확인해 보세요
        </h2>

        <p>
          가장 HOT한 중고거래 물품을<br>
          판다마켓에서 확인해 보세요
        </p>
      </div>
    </section>

    <!-- 배너 밑 이미지 2 : Search -->
    <section class="feature feature-reverse">
      <img src="./images/search_items.png" alt="상품 검색 소개 이미지">

      <div class="feature-content">
        <p>Search</p>

        <h2>
          구매를 원하는<br>
          상품을 검색하세요
        </h2>

        <p>
          구매하고 싶은 물품은 검색해서<br>
          쉽게 찾아보세요
        </p>
      </div>
    </section>

    <!-- 배너 밑 이미지 3 : Register -->
    <section class="feature">
      <img src="./images/register_items.png" alt="상품 등록 소개 이미지">

      <div class="feature-content">
        <p>Register</p>

        <h2>
          판매를 원하는<br>
          상품을 등록하세요
        </h2>

        <p>
          어떤 물건이든 판매하고 싶은 상품을<br>
          쉽게 등록하세요
        </p>
      </div>
    </section>

    <!-- 하단 배너 -->
    <section class="hero">
      <div class="hero-content">
        <h1>
          믿을 수 있는<br>
          판다마켓 중고 거래
        </h1>
      </div>

      <div class="hero-image">
        <img src="./images/ending.png" alt="판다마켓 하단 배너 이미지">
      </div>
    </section>

  </main>

  <!-- 푸터 -->
  <footer class="footer">

    <div class="copyright">
      codeit-2024
    </div>

    <div class="footer-links">
      <a href="/privacy/">Privacy Policy</a>
      <a href="/faq/">FAQ</a>
    </div>

    <div class="sns">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
        <img src="./images/ic_facebook.png" alt="Facebook">
      </a>

      <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer">
        <img src="./images/ic_twitter.png" alt="Twitter">
      </a>

      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <img src="./images/youtube.png" alt="YouTube">
      </a>

      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
        <img src="./images/ic_instagram.png" alt="Instagram">
      </a>
    </div>

  </footer>

</body>
</html>
