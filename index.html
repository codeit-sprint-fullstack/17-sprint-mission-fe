<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="main-header">
      <a class="main-logo" href="/">
        <img src="img/logo.png" alt="판다마켓 로고" class="market-logo" />
        <span class="main-title">판다마켓</span>
      </a>
      <a class="login-button" href="/login"> 로그인 </a>
    </header>
    <main>
      <div class="banner">
        <div class="banner-frame">
          <div class="banner-description">
            <span class="big-text"
              >일상의 모든 물건을 <br />
              거래해 보세요</span
            >
            <a class="banner-button" href="item.html"> 구경하러 가기 </a>
          </div>
          <img src="img/content1.png" alt="banner image" class="banner-image" />
        </div>
      </div>
      <div class="content">
        <div class="content-description">
          <img
            src="img/content2.png"
            alt="Content 1 Image"
            class="content-image"
          />
          <div class="content-description-box">
            <span class="bedge">Hot item</span>
            <p class="big-text">인기 상품을 <br />확인해 보세요</p>
            <p class="content-text">
              가장 HOT한 중고거래 물품을 <br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="content-description">
          <img
            src="img/content3.png"
            alt="Content 2 Image"
            class="content-image"
          />
          <div class="content-description-box">
            <span class="bedge">Search</span>
            <p class="big-text">구매를 원하는 <br />검색해 보세요</p>
            <p class="content-text">
              구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요
            </p>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="content-description">
          <img
            src="img/content4.png"
            alt="Content 3 Image"
            class="content-image"
          />
          <div class="content-description-box">
            <span class="bedge">Register</span>
            <p class="big-text">판매를 원하는<br />상품을 등록하세요</p>
            <p class="content-text">
              어떤 물건이든 판매하고 싶은 상품을 <br />등록하세요
            </p>
          </div>
        </div>
      </div>
      <div class="bottom-banner">
        <div class="bottom-banner-frame">
          <div class="big-text">믿을 수 있는 <br />판다마켓 중고 거래</div>
          <img
            src="img/content5.png"
            alt="Bottom Banner Image"
            class="bottom-banner-image"
          />
        </div>
      </div>
    </main>
    <div class="footer-area">
      <div class="footer-frame">
        <span class="footer-text">@codeit - 2024</span>
        <div class="footer-center">
          <a class="footer-text" href="privacy.html" style="cursor: pointer"
            >Privacy Policy</a
          >
          <a class="footer-text" href="faq.html" style="cursor: pointer">FAQ</a>
        </div>
        <div class="footer-img-area">
          <img
            src="img/facebook.png"
            alt="facebook"
            class="footer-img"
            onclick="window.open('https://www.facebook.com/')"
          />
          <img
            src="img/x.png"
            alt="x"
            class="footer-img"
            onclick="window.open('https://www.x.com/')"
          />
          <img
            src="img/youtube.png"
            alt="youtube"
            class="footer-img"
            onclick="window.open('https://www.youtube.com/')"
          />
          <img
            src="img/instagram.png"
            alt="instagram"
            class="footer-img"
            onclick="window.open('https://www.instagram.com/')"
          />
        </div>
      </div>
    </div>
  </body>
</html>
