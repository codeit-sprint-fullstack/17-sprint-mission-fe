<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--최상단 판다마켓 라인-->
    <header>
      <a href="./pandemarket" target="_blank" class="logo">
        <img src="image/pandamarket-logo.png" alt="판다마켓로고" />
      </a>
      <a href="./login" target="_blank" class="login-btn">로그인</a>
    </header>

    <main>
      <!--상단배너 하늘색-->
      <section class="upper-banner">
        <div class="introduce0">
          <div class="introduce">일상의 모든 물건을 <br />거래해 보세요</div>
          <a href="./items" target="_blank" class="large-bluebtn"
            >구경하러 가기</a
          >
        </div>
        <div class="upperbanner-image">
          <img src="image/upperbanner.png" alt="안녕판다" />
        </div>
      </section>

      <!--컨텐츠1 상품확인-->
      <section class="content-inclu">
        <div class="content">
          <div class="content1-image">
            <img src="image/content1-image.png" alt="초록티셔츠" />
          </div>
          <div class="content-explain">
            <div class="badge">Hot item</div>
            <div class="introduce">인기 상품을 <br />확인해 보세요</div>
            <div class="add-explanation">
              가장 HOT한 중고거래 물품을 <br />판다 마켓에서 확인해 보세요
            </div>
          </div>
        </div>
      </section>

      <!--컨텐츠2 상품검색-->
      <section class="content-inclu">
        <div class="content">
          <div class="content2-explain">
            <div class="badge">Search</div>
            <div class="introduce">구매를 원하는 <br />상품을 검색하세요</div>
            <div class="add-explanation">
              구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요
            </div>
          </div>
          <div class="content2-image">
            <img src="image/content2-image.png" alt="돋보기" />
          </div>
        </div>
      </section>

      <!--컨텐츠3 상품등록-->
      <section class="content-inclu">
        <div class="content">
          <div class="content3-image">
            <img src="image/content3-image.png" alt="여러상품들" />
          </div>
          <div class="content-explain">
            <div class="badge">Register</div>
            <div class="introduce">판매를 원하는 <br />상품을 등록하세요</div>
            <div class="add-explanation">
              어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요
            </div>
          </div>
        </div>
      </section>

      <!--하단배너 하늘색-->
      <section class="lower-banner">
        <div class="content3-explain">
          <div class="introduce">믿을 수 있는 <br />판다마켓 중고 거래</div>
        </div>
        <div class="lowerbanner-image">
          <img src="image/lowerbanner.png" alt="판다대화" />
        </div>
      </section>
    </main>

    <footer>
      <div class="codeit">@codeit - 2024</div>
      <div class="for-client">
        <a href=".privacy" target="_blank">Privacy Policy</a>
        <a href=".faq" target="_blank">FAQ</a>
      </div>
      <!--페이스북 링크-->
      <div class="linkable">
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="image/facebook-logo.png" alt="페이스북" />
        </a>

        <!--트위터 링크-->
        <a
          href="https://x.com/i/jf/onboarding/web?mode=signup"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="image/twitter-logo.png" alt="트위터" />
        </a>

        <!--유튜브 링크-->
        <a
          href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="image/youtube-logo.png" alt="유튜브" />
        </a>

        <!--인스타 링크-->
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="image/instagram-logo.png" />
        </a>
      </div>
    </footer>
  </body>
</html>
