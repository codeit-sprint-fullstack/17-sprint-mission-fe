<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="css.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="nav-content">
        <a class="logo" href="/">
          <img class="logo-img" src="./img/Property 1=md.png" alt="판다마켓" />
        </a>
        <a class="login-button" href="/login">로그인</a>
      </nav>
    </header>

    <main>
      <section class="banner">
        <div class="banner-box">
          <div class="banner-text">
            <h1>
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a class="banner-button" href="/items">구경하러 가기</a>
          </div>
          <img
            class="banner-img"
            src="./img/Img_home_top.png"
            alt="판다마켓 메인 이미지"
          />
        </div>
      </section>

      <section class="popular-products">
        <div class="popular-box">
          <img
            class="popular-img"
            src="./img/Img_home_01.png"
            alt="판다마켓 인기 상품"
          />
          <div class="popular-text">
            <p class="feature-label">Hot item</p>

            <h2>
              인기 상품을 <br />
              확인해 보세요
            </h2>

            <p class="description">
              가장 HOT한 중고거래 물품을<br />
              판다마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="product-search">
        <div class="search-text">
          <p class="feature-label">Search</p>
          <h2>
            구매를 원하는<br />
            상품을 검색하세요
          </h2>

          <p class="description">
            구매하고 싶은 물품을 검색해서<br />
            쉽게 찾아보세요
          </p>
        </div>
        <img
          class="search-img"
          src="./img/Img_home_02.png"
          alt="판다마켓 상품 검색 이미지"
        />
      </section>

      <section class="product-registration">
        <img
          class="registration-img"
          src="./img/Img_home_03.png"
          alt="판다마켓 상품 등록 이미지"
        />
        <div class="registration-text">
          <p class="feature-label">Register</p>
          <h2>
            판매를 원하는<br />
            상품을 등록하세요
          </h2>

          <p class="description">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </section>

      <section class="last-banner">
        <div class="last-banner-box">
          <h2>
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h2>

          <img
            class="last-banner-img"
            src="./img/Img_home_bottom.png"
            alt="판다마켓 중고 거래 이미지"
          />
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>©codeit - 2024</p>

        <div class="footer-menu">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </div>
        <div class="sns-links">
          <a class="sns-link" href="https://www.facebook.com/" target="_blank">
            <img src="./img/ic_facebook.png" alt="페이스북" />
          </a>
          <a class="sns-link" href="https://twitter.com/" target="_blank">
            <img src="./img/ic_twitter.png" alt="트위터" />
          </a>
          <a class="sns-link" href="https://www.youtube.com/" target="_blank">
            <img src="./img/ic_youtube.png" alt="유튜브" />
          </a>
          <a class="sns-link" href="https://www.instagram.com/" target="_blank">
            <img src="./img/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
