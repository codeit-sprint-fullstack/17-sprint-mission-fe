    <title>판다마켓</title>

<body>
    <!--상단 네비게이션 바-->
    <header class="navbar">
        <a class="logo" href="#">
            <img src="./img/logo.png" alt="">
            <p>판다마켓</p>
        </a>
        <div class="login">
            <a href="./login.html">로그인</a>
        </div>
    </header>
    <!--내용부분-->
    <main class="main">
        <div class="top-bottom">
            <div class="items">
                <div class="items-text">
                    <p>일상의 모든 물건을<br>거래해 보세요</p>
                    <a href="./items.html"><div class="dir-link">구경하러 가기</div></a>
                </div>
                <img class="topbottom-img" src="./img/img_home_top.png" alt="소개 이미지">
            </div>
        </div>
        <div class="content">
            <div class="content-items">
                <div class="content-items-text">
                    <p class="topic">Hot item</p>
                    <p class="main-text">인기 상품을<br>확인해 보세요</p>
                    <p class="sub-text">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                </div>
                <img class="banner-img" src="./img/img_home_01.png" alt="배너 이미지 1">
            </div>
        </div>
        <div class="content">
            <div class="content-items" id="even">
                <div class="content-items-text">
                    <p class="topic">Search</p>
                    <p class="main-text">구매를 원하는<br>상품을 검색하세요</p>
                    <p class="sub-text">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                </div>
                <img class="banner-img" src="./img/img_home_02.png" alt="배너 이미지 2">
            </div>
        </div>
        <div class="content">
            <div class="content-items">
                <div class="content-items-text">
                    <p class="topic">Register</p>
                    <p class="main-text">판매를 원하는<br>상품을 등록하세요</p>
                    <p class="sub-text">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                </div>
                <img class="banner-img" src="./img/img_home_03.png" alt="배너 이미지 3">
            </div>
        </div>
        <div class="top-bottom">
            <div class="items">
                <div class="items-text">
                    <p>믿을 수 있는<br>판다마켓 중고 거래</p>
                </div>
                <img class="topbottom-img" src="./img/img_home_bottom.png" alt="푸터 이미지">
            </div>
        </div>
