<!-- 로그인 페이지 제작 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="body-container">
    <header>
      <nav>
        <a>
          <!-- 입력사항 없음 -->
        </a>
      </nav>
    </header>

    <main class="main-container">
      <!-- 1. 로그인 화면 - 판다로고 -->
      <section class="logo-section">
        <nav class="logo-nav" aria-label="주요 메뉴">
          <a class="logo-block" href="index.html">
            <img class="logo-face" src="image/panda_logo.png" alt="" />
            <img
              class="logo-text"
              src="image/panda_sign.png"
              alt="판다마켓 홈"
            />
          </a>
        </nav>
      </section>

      <!-- 2. 로그인 화면 - 사용자 이메일/비밀번호/로그인 버튼 -->
      <form class="login-form">
        <!-- 로그인 화면 - 사용자 이메일 -->
        <div class="input-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="이메일을 입력해 주세요" />
        </div>

        <!-- 로그인 화면 - 비밀번호 -->
        <div class="input-group">
          <label for="password">비밀번호</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="비밀번호를 입력해 주세요"
            />
            <!-- 눈 모양 아이콘 (필요시 추가) -->
            <button
              type="button"
              class="eye-icon-btn"
              aria-label="비밀번호 표시"
            >
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <!-- 로그인 화면 - 로그인 버튼 -->
        <!-- <a class="login-button" href="./login">로그인</a> -->
        <button type="submit" class="login-btn" href="./login">로그인</button>
      </form>

      <!-- 3. 로그인 화면 - 간편 로그인 -->
      <section class="simplelogin-section" aria-label="간편 로그인">
        <span class="simplelogin-text">간편 로그인하기</span>

        <div class="simplelogin-iconbox" aria-label="간편 로그인 아이콘">
          <a
            class="simplelogin-icon"
            href="https://www.google.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/google-icon.png" alt="구글" />
          </a>

          <a
            class="simplelogin-icon"
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image/kakao-icon.png" alt="카카오톡" />
          </a>
        </div>
      </section>

      <!-- 4. 로그인 화면 - 회원가입 -->
      <section class="signup-section">
        <div class="signup-text">
          <p>판다마켓이 처음이신가요?</p>
        </div>
        <div class="signup-link">
          <!-- <a href="signup.html">회원가입</a> -->
          <!-- <a href="./signup">회원가입</a> -->
          <a href="signup.html">회원가입</a>
        </div>
      </section>
    </main>

    <footer>
      <!-- 입력사항 없음 -->
    </footer>
  </body>
</html>
