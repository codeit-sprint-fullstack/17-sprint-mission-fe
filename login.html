<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 판다마켓</title>

    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./auth.css" />
  </head>

  <body>
    <main class="auth-container">
      <!-- 판다마켓 로고 -->
      <a href="./index.html" class="auth-logo">
        <img src="./img/panda logo.png" alt="판다마켓" />
      </a>

      <!-- 로그인 폼 -->
      <form class="auth-form">
        <div class="input-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">비밀번호</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              aria-label="비밀번호 표시"
              aria-pressed="false"
            >
              <img
                src="./img/btn_visibility_on_24px.png"
                alt=""
                width="24"
                height="24"
              />
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit">로그인</button>
      </form>

      <!-- 간편 로그인 -->
      <div class="social-login">
        <span>간편 로그인하기</span>

        <div class="social-buttons">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/google.png" alt="구글" />
          </a>

          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/kakao.png" alt="카카오" />
          </a>
        </div>
      </div>

      <!-- 회원가입 페이지 이동 -->
      <p class="auth-switch">
        판다마켓이 처음이신가요?
        <a href="./signup.html">회원가입</a>
      </p>
    </main>

    <!-- 비밀번호 표시/숨김 -->
    <script>
      const passwordToggle = document.querySelector(".password-toggle");
      const passwordInput = document.querySelector("#password");

      passwordToggle.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        passwordToggle.setAttribute(
          "aria-label",
          isHidden ? "비밀번호 숨기기" : "비밀번호 표시",
        );

        passwordToggle.setAttribute("aria-pressed", String(isHidden));
      });
    </script>
  </body>
</html>
