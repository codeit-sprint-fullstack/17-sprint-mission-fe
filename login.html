<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="loginStyle.css" />
  </head>
  <body>
    <!--판다마켓 로고-->
    <header>
      <a href="./pandemarket" target="_blank" class="logo">
        <img src="image/pandamarket-logo.png" alt="판다마켓로고" />
      </a>
    </header>
    <main>
      <!--이메일/비밀번호/로그인세트-->
      <section>
        <form action="/login" method="post" class="login-set">
          <label for="user-email" class="text">이메일</label>
          <input
            type="email"
            id="user-email"
            name="userEmail"
            class="input-item0"
            placeholder="이메일을 입력해주세요"
            required
          />
          <label for="user-password" class="text">비밀번호</label>
          <div class="password-box">
            <input
              type="password"
              id="user-password"
              name="userPassword"
              placeholder="비밀번호를 입력해주세요"
              class="input-item"
              required
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword()"
              aria-label="비밀번호 표시 전환"
            >
              👁
            </button>
          </div>
          <button type="submit" class="login-btn">로그인</button>
        </form>
      </section>
      <!--하단배너 간편로그인-->
      <section class="lower-banner">
        <div class="text2">간편 로그인하기</div>
        <!--간편로그인 아이콘-->
        <div class="social-login">
          <!--구글 간편로그인-->
          <a href="https://www.google.com/">
            <img
              src="image/google-icon.png"
              alt="구글로그인"
              class="google-icon"
            />
          </a>
          <!--카카오톡 간편로그인-->
          <a href="https://www.kakaocorp.com/page/">
            <img
              src="image/kakao-icon.png"
              alt="카카오톡 로그인"
              class="kakao-icon"
            />
          </a>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-text1">판다마켓이 처음이신가요?</div>
      <a href="./signup.html" target="_blank" class="signup">회원가입</a>
    </footer>
  </body>
</html>
