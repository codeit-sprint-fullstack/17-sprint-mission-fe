<!doctype html>
<html>
  <head>
    <title>회원가입 - 판다마켓</title>
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <div class="login-page">
      <div class="login-box">
        <a href="../index.html" class="logo">
          <img src="../images/logo.png" alt="판다마켓" />
          <span>판다마켓</span>
        </a>

        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="이메일을 입력해주세요" />
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" placeholder="닉네임을 입력해주세요" />

        <label for="password">비밀번호</label>
        <div class="password-field">
          <input
            id="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="비밀번호 보기"
            onclick="togglePassword('password')"
          >
            <img src="../images/eyes.png" alt="" />
          </button>
        </div>
        <label for="confirm-password">비밀번호 확인</label>
        <div class="password-field">
          <input
            id="confirm-password"
            type="password"
            placeholder="비밀번호를 다시 입력해주세요"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="비밀번호 확인 보기"
            onclick="togglePassword('confirm-password')"
          >
            <img src="../images/eyes.png" alt="" />
          </button>
        </div>

        <button id="signup-submit" disabled>회원가입</button>
        <div class="social-login">
          <span>간편 로그인하기</span>
          <a href="https://www.google.com/" aria-label="Google 로그인">
            <img src="../images/google.png" alt="" />
          </a>
          <a href="https://www.kakaocorp.com/page/" aria-label="카카오 로그인">
            <img src="../images/kakao.png" alt="" />
          </a>
        </div>

        <p>
          이미 회원이신가요?
          <a href="../login/index.html">로그인</a>
        </p>
      </div>
    </div>
    <script>
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
      }
      const emailInput = document.getElementById("email");
      const nicknameInput = document.getElementById("nickname");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const signupButton = document.getElementById("signup-submit");

      function updateSignupButton() {
        signupButton.disabled =
          !emailInput.value.trim() ||
          !nicknameInput.value.trim() ||
          !passwordInput.value ||
          !confirmPasswordInput.value;
      }

      emailInput.addEventListener("input", updateSignupButton);
      nicknameInput.addEventListener("input", updateSignupButton);
      passwordInput.addEventListener("input", updateSignupButton);
      confirmPasswordInput.addEventListener("input", updateSignupButton);
    </script>
  </body>
</html>
