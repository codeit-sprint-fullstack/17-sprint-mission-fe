<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 판다마켓</title>
    <link rel="icon" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
    <script defer src="/assets/js/script.js"></script>
    <script defer src="/assets/js/auth.js"></script>
</head>
<body>
    <div id="wrap" class="auth">
        <header>
            <a href="/" class="logo">
                <img src="/assets/images/logo.png" alt="판다마켓">
            </a>
        </header>
        <main class="container">
            <h1 class="blind">회원가입</h1>
            <form action="" method="POST" class="form-login" name="signup">
                <div class="field">
                    <label class="form-label" for="signup-email">이메일</label>
                    <input class="form-input" id="signup-email" name="email" type="email" placeholder="이메일을 입력해주세요" required>
                    <span class="error-message"></span>
                </div>
                <div class="field">
                    <label class="form-label" for="signup-name">닉네임</label>
                    <input class="form-input" id="signup-name" name="name" type="text" placeholder="닉네임을 입력해주세요" required>
                    <span class="error-message"></span>
                </div>
                <div class="field">
                    <label class="form-label" for="signup-pw">비밀번호</label>
                    <input class="form-input" id="signup-pw" name="pw" type="password" placeholder="비밀번호를 입력해주세요" minlength="8" required>
                    <button class="toggle-pw" type="button" aria-label="비밀번호 보기" aria-pressed="false"></button>
                    <span class="error-message"></span>
                </div>
                <div class="field">
                    <label class="form-label" for="signup-confirm-pw">비밀번호 확인</label>
                    <input class="form-input" id="signup-confirm-pw" name="pw-confirm" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요" minlength="8" required>
                    <button class="toggle-pw" type="button" aria-label="비밀번호 보기" aria-pressed="false"></button>
                    <span class="error-message"></span>
                </div>
                <button class="btn-submit btn-lg" type="submit" disabled>회원가입</button>
            </form>
            <div class="field-login-sns">
                <h2>간편 로그인하기</h2>
                <div class="sns-list">
                    <a href="https://www.google.com/">
                        <img src="/assets/images/ic_google.png" alt="구글 로그인">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="/assets/images/ic_kakao.png" alt="카카오 로그인">
                    </a>
                </div>
            </div>
            <div class="field-auth">
                <p>이미 회원이신가요?</p>
                <a href="/login">로그인</a>
            </div>
        </main>
    </div>
</body>
</html>
