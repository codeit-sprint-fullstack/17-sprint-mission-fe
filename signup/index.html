<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MQ4HMV7C');</script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ4HMV7C"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <main class="auth">
      <!-- 로고 -->
      <a href="/" class="auth-logo">
        <span class="auth-logo-icon">
          <img src="/images/logo/panda-face.png" alt="" />
        </span>
        <img
          class="auth-logo-text"
          src="/images/logo/logo-text.png"
          alt="판다마켓"
        />
      </a>

      <!-- 회원가입 폼 -->
      <form class="auth-form">
        <div class="field">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div class="field">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <button
              type="button"
              class="password-toggle"
              aria-label="비밀번호 보기"
            >
              <img src="/images/icons/ic_eye_off.png" alt="" />
            </button>
          </div>
        </div>

        <div class="field">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password-confirm"
              name="password-confirm"
              minlength="8"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
              required
            />
            <button
              type="button"
              class="password-toggle"
              aria-label="비밀번호 확인 보기"
            >
              <img src="/images/icons/ic_eye_off.png" alt="" />
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">회원가입</button>
      </form>

      <!-- 간편 로그인 -->
      <div class="easy-login">
        <span>간편 로그인하기</span>
        <div class="easy-login-links">
          <a
            href="https://www.google.com/"
            class="easy-login-google"
            aria-label="구글로 로그인"
          >
            <img src="/images/icons/ic_google.png" alt="" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            class="easy-login-kakao"
            aria-label="카카오로 로그인"
          >
            <img src="/images/icons/ic_kakao.png" alt="" />
          </a>
        </div>
      </div>

      <!-- 하단 링크 -->
      <p class="auth-switch">
        이미 회원이신가요? <a href="/login/">로그인</a>
      </p>
    </main>
  </body>
</html>
