<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 판다마켓</title>
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="../auth.css" />
  </head>
  <body>
    <main class="auth">
      <a class="logo" href="/">
        <img src="../img/Property 1=md@2x.png" alt="판다마켓" />
      </a>

      <form class="auth-form">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="이메일을 입력해주세요" />

        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" placeholder="닉네임을 입력해주세요" />

        <label for="password">비밀번호</label>
        <input
          id="password"
          type="password"
          placeholder="비밀번호를 입력해주세요"
        />

        <label for="password-check">비밀번호 확인</label>
        <input
          id="password-check"
          type="password"
          placeholder="비밀번호를 다시 한 번 입력해주세요"
        />

        <button type="button" disabled>회원가입</button>
      </form>

      <div class="social">
        <span>간편 로그인하기</span>
        <div class="social-icons">
          <a class="google" href="https://www.google.com/">
            <img src="../img/google-logo.png" alt="구글" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="../img/kakao-logo.png" alt="카카오톡" />
          </a>
        </div>
      </div>

      <p class="other-page">이미 회원이신가요? <a href="/login">로그인</a></p>
    </main>
  </body>
</html>
